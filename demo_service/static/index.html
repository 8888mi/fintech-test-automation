<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Payments</title>
  <style>
    :root { --line: #d8dce3; --ink: #12161c; --muted: #6b7280; --accent: #1f6feb; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 48px 24px;
      font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink); background: #f6f7f9;
    }
    main { max-width: 620px; margin: 0 auto; }
    h1 { font-size: 22px; letter-spacing: -0.01em; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 32px; font-size: 14px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
    label:first-of-type { margin-top: 0; }
    input, select {
      width: 100%; padding: 9px 11px; font: inherit;
      border: 1px solid var(--line); border-radius: 6px; background: #fff;
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
    button {
      margin-top: 24px; width: 100%; padding: 11px; font: inherit; font-weight: 600;
      color: #fff; background: var(--accent); border: 0; border-radius: 6px; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .result { margin-top: 24px; padding: 16px; border-radius: 8px; font-size: 14px; display: none; }
    .result.show { display: block; }
    .result.ok { background: #e8f5ec; border: 1px solid #a9d5b8; }
    .result.err { background: #fdeaea; border: 1px solid #eab0b0; }
    .row { display: flex; justify-content: space-between; padding: 3px 0; }
    .row span:first-child { color: var(--muted); }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>Demo Payments</h1>
  <p class="sub">Minimal UI over the payments API — used as the Playwright target.</p>

  <div class="card">
    <label for="account">Account ID</label>
    <input id="account" data-testid="account-input" value="ACC-DEMO-0001" />

    <label for="amount">Amount (minor units)</label>
    <input id="amount" data-testid="amount-input" type="number" value="25000" />

    <label for="currency">Currency</label>
    <select id="currency" data-testid="currency-select">
      <option>USD</option><option>EUR</option><option>TRY</option><option>GBP</option>
    </select>

    <label for="description">Description</label>
    <input id="description" data-testid="description-input" value="Loan repayment" />

    <button id="submit" data-testid="submit-button">Create payment</button>

    <div id="result" class="result" data-testid="result-panel"></div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);

  $("submit").addEventListener("click", async () => {
    const btn = $("submit");
    const panel = $("result");
    btn.disabled = true;
    panel.className = "result";

    const payload = {
      account_id: $("account").value,
      amount_minor: Number($("amount").value),
      currency: $("currency").value,
      description: $("description").value,
      idempotency_key: crypto.randomUUID(),
    };

    try {
      const res = await fetch("/api/v1/payments", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const body = await res.json();

      if (!res.ok) {
        panel.className = "result show err";
        panel.innerHTML = `<strong data-testid="result-status">ERROR ${res.status}</strong>
          <div data-testid="result-detail"><code>${JSON.stringify(body.detail)}</code></div>`;
        return;
      }

      panel.className = "result show ok";
      panel.innerHTML = `
        <strong data-testid="result-status">${body.status}</strong>
        <div class="row"><span>Payment ID</span><code data-testid="result-payment-id">${body.payment_id}</code></div>
        <div class="row"><span>Amount</span><span data-testid="result-amount">${body.amount_minor} ${body.currency}</span></div>
        ${body.rejection_reason ? `<div class="row"><span>Reason</span><span data-testid="result-reason">${body.rejection_reason}</span></div>` : ""}`;
    } catch (err) {
      panel.className = "result show err";
      panel.innerHTML = `<strong data-testid="result-status">NETWORK_ERROR</strong>`;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
